trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'govapp-nginx'

steps:
# 1️⃣ Логін у контейнерний реєстр (або DockerHub, або ACR)
- task: DockerInstaller@0
  displayName: 'Install Docker'

- task: Docker@2
  displayName: 'Build Docker image'
  inputs:
    command: 'build'
    Dockerfile: '**/Dockerfile'
    tags: |
      $(imageName):$(Build.BuildId)

# 2️⃣ (опціонально) Пуш до DockerHub / Azure Container Registry
# Використай свої секрети (DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD)
- task: Docker@2
  displayName: 'Push Docker image to DockerHub'
  inputs:
    containerRegistry: 'DockerHubConnection'
    repository: '$(imageName)'
    command: 'push'
    tags: |
      $(imageName):$(Build.BuildId)

# 3️⃣ Деплой у Azure Web App for Containers
- task: AzureWebAppContainer@1
  inputs:
    azureSubscription: 'MyAzureConnection'
    appName: 'govapp-nginx-test'
    imageName: '$(imageName):$(Build.BuildId)'
